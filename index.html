<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>国潮像素捕鱼</title>
  <link rel="stylesheet" href="./src/styles/game.css" />
</head>
<body>
  <main id="gameWrap">
    <canvas id="game" aria-label="国潮像素捕鱼游戏画布"></canvas>

    <section class="topHud" aria-label="游戏状态">
      <div class="panel playerPanel">
        <b>玩家号</b>
        <span id="playerIdText">连接中</span>
      </div>
      <div class="panel">
        <b>金币</b>
        <span id="coinText">0</span>
      </div>
      <div class="panel">
        <b>倍率</b>
        <span id="rateText">10</span>
      </div>
      <div class="panel">
        <b>连击</b>
        <span id="comboText">0</span>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="networkBanner" class="networkBanner" hidden>服务器未连接</div>

    <section class="bottomBar" aria-label="炮台控制">
      <button class="stepBtn" id="minusBtn" type="button" aria-label="降低炮值">-</button>
      <div class="cannonBox">
        <div class="meter">
          <b>炮值</b>
          <span id="powerText">10</span>
        </div>
        <div class="statusPill">
          <b>锁定</b>
          <span id="lockText">无</span>
        </div>
        <div class="statusPill compact">
          <b>模式</b>
          <span>长按连发</span>
        </div>
      </div>
      <button class="stepBtn" id="plusBtn" type="button" aria-label="提高炮值">+</button>
    </section>
  </main>

  <script type="module" src="./src/js/game.js"></script>
</body>
</html>
