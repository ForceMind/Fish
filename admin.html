<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>捕鱼管理后台</title>
  <link rel="stylesheet" href="./src/styles/admin.css" />
</head>
<body>
  <main class="adminShell">
    <header class="adminHeader">
      <div>
        <p class="eyebrow">本机管理后台</p>
        <h1>玩家游戏币管理</h1>
      </div>
      <button id="refreshBtn" type="button">刷新</button>
      <div class="headerActions">
        <button id="cleanupTempBtn" class="dangerBtn" type="button">清理临时账号</button>
      </div>
    </header>

    <section class="toolbar">
      <form id="coinForm" class="coinForm">
        <label>
          玩家号
          <input id="playerIdInput" name="playerId" autocomplete="off" placeholder="例如 P8A31F2" required />
        </label>
        <label>
          加币数量
          <input id="amountInput" name="amount" type="number" min="1" step="1" value="1000" required />
        </label>
        <button type="submit">加币</button>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <section class="tableWrap" aria-label="玩家列表">
      <table>
        <thead>
          <tr>
            <th>玩家号</th>
            <th>金币</th>
            <th>累计购买</th>
            <th>累计消耗</th>
            <th>累计捕获</th>
            <th>最后在线</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="playersBody">
          <tr><td colspan="7">加载中</td></tr>
        </tbody>
      </table>
    </section>
    <section class="metricsGrid" aria-label="房间实时数据">
      <div class="metricCard">
        <b>在线房间</b>
        <span id="activeRoomsText">0</span>
      </div>
      <div class="metricCard">
        <b>总奖池</b>
        <span id="totalPoolText">0</span>
      </div>
      <div class="metricCard">
        <b>当前 RTP</b>
        <span id="totalRtpText">0%</span>
      </div>
      <div class="metricCard">
        <b>MISS 率</b>
        <span id="missRateText">0%</span>
      </div>
    </section>

    <section class="tableWrap roomTableWrap" aria-label="房间列表">
      <table>
        <thead>
          <tr>
            <th>房间号</th>
            <th>在线</th>
            <th>鱼数</th>
            <th>奖池</th>
            <th>目标 RTP</th>
            <th>当前 RTP</th>
            <th>开火</th>
            <th>有效/MISS</th>
            <th>暴击</th>
            <th>捕获</th>
            <th>鸿运</th>
            <th>技能</th>
            <th>最后活跃</th>
          </tr>
        </thead>
        <tbody id="roomsBody">
          <tr><td colspan="13">加载中</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module" src="./src/js/admin.js"></script>
</body>
</html>
